# BattleTanx: Global Assault's RSP audio microcode (n_aspMain), recompiled by
# N64Recomp's RSPRecomp -- same approach as BanjoRecomp's n_aspMain.us.rev0.toml.
# See STATUS.md round 90.
#
# Located from the game's own audio-task setup: func_800FF698 passes ucode
# text 0x800FA210 / data 0x801262E0. ROM offset = vram - 0x80070000.
# Same 0xC60-byte size as Banjo's n_aspMain but a slightly different build:
# every dispatch entry is 4 bytes below Banjo's.
text_offset = 0x8A210
text_size = 0xC60
text_address = 0x04001080
rom_file_path = "BattleTanx Global Assault (USA).z64"
output_file_path = "rsp/n_aspMain.cpp"
output_function_name = "n_aspMain"
extra_indirect_branch_targets = [
    # command dispatch table, the first 16 halfwords of the ucode data
    # (0x801262E0). Two slots are 0 and one is 0x02B0 (outside the text):
    # unused commands, left out. All 13 below follow a `j 0x10EC` or `jr $ra`.
    0x10EC, 0x139C, 0x119C, 0x1A64, 0x11C8, 0x17EC, 0x1208, 0x127C, 0x1348, 0x1248, 0x1C84, 0x12D4, 0x1384
]
