# func_80147864's four div/ddiv/ddivu hooks (was here) removed round 21.
# The whole function turned out to be a false n64sym-adjacent match -- its
# declared body starts with two identical self-referential `beql $s4, $s4`
# branches (not a real prologue) and goes straight to undecodable garbage a
# few words in. All four "div" operands round 18 found here were r0/r0
# (dividing $zero by $zero) -- a real compiler never emits that; it's what
# raw data bytes coincidentally decoding as a div-family opcode looks like.
# See STATUS.md round 21 and the deleted entry in
# BattleTanxGASyms/battletanxga.us.rev0.syms.toml.

# Round 49 (STATUS.md): func_80098B40 is a bare `while (flag != 0) {}` spin
# (polling vram 0x80229230 -- a real N64 controller-read lock, meant to be
# cleared once another thread's synchronous osContGetReadData call
# finishes). On real hardware this works because the clearing thread's SI
# interrupt preempts the spinning CPU unconditionally; ultramodern's N64
# thread scheduler is purely cooperative (see ultramodern/src/scheduling.cpp)
# with no equivalent preemption, so once this thread becomes "active" no
# other N64 thread -- including whichever one needs to clear the flag --
# can ever run again, hanging the whole game (confirmed via debugger thread
# dumps, STATUS.md round 48).
#
# Round 49's attempt (yield_self_1ms, scheduling.cpp:45-48) confirmed via
# debugger that it wasn't enough: it only switches via check_running_queue's
# strictly-greater-priority check (scheduling.cpp:24), and real libultra's
# osYieldThread -- which would round-robin to an *equal*-or-higher-priority
# ready thread -- is entirely unimplemented in this runtime fork
# (ultra_translation.cpp:31-34 just asserts false). So a same-or-lower
# priority thread waiting to clear the flag never gets a turn.
#
# Round 50: work around the missing osYieldThread using only the public,
# already-proven-working osGetThreadPri/osSetThreadPri (both plain
# `extern`, decoded via `[[patches.hook]]` same as round 49). Temporarily
# drop this thread's own priority to the minimum (0) before yielding --
# osSetThreadPri triggers check_running_queue itself whenever priority
# actually changes (threads.cpp:314-322) -- which makes the strict `>`
# check trivially true for essentially any other ready thread, then restore
# the original priority once control returns.
#
# Round 51: this logic is now shared (src/main/scheduler_workaround.cpp,
# `btga_yield_via_priority_drop`) instead of inlined per-site, since round
# 51 found a second unrelated polling loop needing the exact same fix (see
# the func_800A1384 patch below) -- confirmed via debugger that round 50
# genuinely fixed *this* spin (a different thread/address showed up as the
# new active hang site on the next test run, not this one again).
[[patches.hook]]
func = "func_80098B40"
before_vram = 0x80098B40
text = """
    { extern void btga_yield_via_priority_drop(uint8_t *rdram); btga_yield_via_priority_drop(rdram); }
"""

# Round 51 (STATUS.md): after round 50 fixed func_80098B40's spin, the game
# progressed further and hit a second, structurally identical scheduler gap
# at func_800A1384 -- confirmed via debugger call stack (this function
# directly on top, no OS call beneath it). It's not an integer flag spin
# like func_80098B40; it copies a 0x208-byte struct from a fixed shared
# address (vram 0x80222930 -- the same "plain data accessor" pointer round
# 46 identified next to the audio DMA callback thread func_800A1290) into a
# stack buffer, then re-loops from scratch (back to L_800A1398) if fields
# inside the just-copied data (offsets 0x1F4/0x1FC) haven't reached an
# expected state -- i.e. polling another thread's write via a copy-and-check
# pattern instead of a plain while loop, but the same underlying bug: no OS
# call inside it, so it never gives the scheduler a chance. Same fix,
# applied once per outer pass (before_vram = the outer loop's own re-entry
# label) rather than inside the bounded 32-iteration inner copy.
[[patches.hook]]
func = "func_800A1384"
before_vram = 0x800A1398
text = """
    { extern void btga_yield_via_priority_drop(uint8_t *rdram); btga_yield_via_priority_drop(rdram); }
"""

# Round 53 (STATUS.md): round 51's yield at L_800A1398 (the outer loop's
# re-entry point) doesn't cover every loop-back path in this function.
# After the bounded 32-iteration inner copy (L_800A139C) finishes a pass,
# a field check (vram 0x800A13F8, `sp+0x1F0 < 5`) can jump directly back to
# L_800A139C *without* ever passing through L_800A1398 again -- bypassing
# our only yield entirely. Confirmed via debugger: func_800A1384 stayed
# active with zero further calls into btga_yield_via_priority_drop (no
# repeat prints from its own throttled diagnostic) while CPU stayed pegged
# at the same one-core-spinning ~10% -- i.e. it fell into this un-yielding
# inner-only cycle. Since before_vram matches on an exact address and both
# entry paths converge on the same vram (0x800A139C), there's no way to
# hook only the bypass path -- so add the same yield at L_800A139C's own
# address, accepting that it now also fires on every 16-byte inner-copy
# iteration (up to 32x per outer pass) instead of just once. That's a
# real slowdown on this one copy loop, but harmless compared to hanging
# indefinitely, and it stops being called at all once the condition this
# loop is polling for is finally satisfied.
[[patches.hook]]
func = "func_800A1384"
before_vram = 0x800A139C
text = """
    { extern void btga_yield_via_priority_drop(uint8_t *rdram); btga_yield_via_priority_drop(rdram); }
"""

