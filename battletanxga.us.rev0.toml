# Round 66 (STATUS.md): a fifth unyielding-poll-loop-class deadlock, but
# structurally different from func_80098B40/func_800A1384/func_80079FF0:
# those all re-read memory each iteration (a real `while (*ptr == 0) {}`),
# so a bare yield was sufficient. This one loads the 0x801147E8 "task
# ready" flag into $v0 *once* before the loop, then
# `bne $v0, zero, L_800978D8` spins on that stale register copy forever --
# never rereading memory, no OS call inside -- so a yield alone would just
# turn a CPU-pegging infinite loop into a yielding-but-still-infinite one.
# func_80097844 is the function that *sets* this flag; it only reaches
# this spin if called while the flag is already non-zero (a race this
# project's cooperative single-thread-at-a-time scheduler can expose even
# if real N64 hardware's actual RSP/CPU timing rarely hit it). The flag
# gets cleared by func_800976AC (`sw $zero, 0x47E8`) on another thread,
# which the yield (not the reload alone) gives a chance to actually run.
# Confirmed via live diagnostics (not a static disassembly guess): rounds
# 65 parts 1-5 proved func_800A1290's VI-message dispatch chain was
# healthy and delivering continuously, narrowing the real gap down to
# this specific gate. Fix: yield (to let func_800976AC's thread run), then
# redo the exact lui+lw this loop's own entry used to recompute $v0 fresh,
# so the loop can actually observe the flag once it clears.
[[patches.hook]]
func = "func_80097844"
before_vram = 0x800978D8
text = """
    { extern void btga_yield_via_priority_drop(uint8_t *rdram); btga_yield_via_priority_drop(rdram); ctx->r2 = MEM_W(S32(0x8011 << 16), 0x47E8); }
"""

# Note (round 69, STATUS.md): 0x801147E8 is NOT a gfx gate -- it's the
# "pending audio OSTask*" handoff slot. func_80097844 (audio thread) builds
# an M_AUDTASK OSTask on its own stack and posts its address there, then
# blocks on mq 0x801B4590; func_800A140C picks it up into its 0x200 slot
# and submits it (preempting any running gfx task via osSpTaskYield);
# func_800976AC wakes the audio thread and clears the slot when it's done.
# With audio stubbed (round 58's func_801025C0), it correctly stays 0 --
# "no audio task pending". Rounds 67-68 wrongly forced it non-zero, which
# made func_800A140C submit task pointer 0x00000001 to the SP and crash.
# Reverted. The real post-3-frames freeze is func_8007A818's framebuffer
# wait (hooks below).

# Round 69 (STATUS.md): the actual post-3-frames freeze. func_8007A818
# acquires a free framebuffer for the next frame: 3 framebuffers (indices
# 0-2), with three "in use" slots at 0xB2/0xB4/0xB6 of the state struct at
# *0x80114500. If all three are taken it retries forever (L_8007A880 ->
# `beq $v0, $a3, L_8007A828`) with no OS call inside -- so the cooperative
# scheduler never runs the VI-dispatch thread (func_800A1290 ->
# func_800A140C -> func_800A1858's osViSwapBuffer) that would release one,
# and that thread's VI messages never even get drained from ultramodern's
# external queue. 3 framebuffers == exactly 3 gfx tasks, then every other
# thread starves (debugger: game thread parked at funcs_0.c:6257, inside
# this loop; every throttled diagnostic in every other thread went silent
# at once). Same unyielding-poll-loop family as rounds 50/51/53/60, and the
# loop re-reads 0xB2/0xB4/0xB6 from memory every pass, so a yield is enough.
# Only yields on the retry path (no free buffer found), so the normal
# found-one-immediately path is untouched.
[[patches.hook]]
func = "func_8007A818"
before_vram = 0x8007A888
text = """
    if (ctx->r2 == ctx->r7) { extern void btga_yield_via_priority_drop(uint8_t *rdram); btga_yield_via_priority_drop(rdram); }
"""

# Round 69: same function, its entry wait. `lh $t0, 0xB0($a1)` loads the
# "framebuffer currently being rendered" field ONCE, then
# `bne $t0, $a3, L_8007A828` spins on that stale register copy -- the
# round 66 func_80097844 pattern, an unconditional hang if ever entered.
# Not the observed hang (the debugger shows the thread past it), but fixed
# preemptively: only acts when the original code would spin forever
# (t0 != -1), yielding and re-reading the field so the wait can complete.
# On the retry path above t0 is already -1, so this is a no-op there.
[[patches.hook]]
func = "func_8007A818"
before_vram = 0x8007A828
text = """
    if (ctx->r8 != ctx->r7) { extern void btga_yield_via_priority_drop(uint8_t *rdram); btga_yield_via_priority_drop(rdram); ctx->r8 = MEM_H(ctx->r5, 0xB0); }
"""

# Round 61 (STATUS.md, REVERTED): tried injecting a call to recompui's
# per-frame UI callback pump (recomp_run_ui_callbacks,
# lib/RecompFrontend/recompui/src/api/ui_api_events.cpp) directly into
# func_8009D3A4's loop-back label via [[patches.hook]], to fix the
# unresponsive black screen once in-game. Tested: made things worse (a
# real Windows-detected app hang, versus merely-unresponsive-but-stable
# before). Root cause: recomp_run_ui_callbacks can call
# LOOKUP_FUNC(...)(rdram, ctx) -- executing arbitrary real game code
# (whatever UI callback is queued) using the *same* ctx as whatever's
# mid-execution at the injection point. [[patches.hook]] splices raw text
# into the middle of an existing function's body, not a real call
# boundary with proper register save/restore -- so nothing protects
# func_8009D3A4's own register-resident locals (s0-s7, used throughout
# its real logic) from being clobbered by whatever a fired callback does.
# Reverted. Wiring this up correctly likely needs BanjoRecomp's actual
# approach: a full RECOMP_PATCH (complete function replacement, which
# gets proper compiler-managed register preservation at its own call
# boundary) via the ELF-based patches/ toolchain this project has never
# set up -- not a same-context mid-body injection.

# Round 65 (STATUS.md): after round 64's merged-function fix let the game
# progress further, func_800A1290 (the VI-message dispatcher thread) was
# found permanently stuck at its own first osRecvMesg -- not merely idle
# between messages, confirmed by repeated debugger samples that never
# moved. Traced to the same drain gap documented above
# (btga_yield_via_priority_drop's own comment, and the round 52 note
# below): the VI thread only ever enqueues into ultramodern's intermediate
# `external_messages` queue: it's only delivered into a real OSMesgQueue
# (waking a blocked osRecvMesg) once some game thread calls
# yield_self_1ms/wait_for_external_message. The three existing yield hooks
# above (func_80098B40, func_800A1384, func_80079FF0) provided that drain
# incidentally, but the game no longer executes any of that code once
# round 64 let it past -- so nothing is left draining the queue at all.
# This is NOT the round 61 mistake: btga_yield_via_priority_drop takes
# only `rdram`, never touches `ctx`, so it can't corrupt whatever the
# hooked function's own register-resident locals are doing (unlike
# recomp_run_ui_callbacks, which manipulates ctx and invokes arbitrary
# game code via LOOKUP_FUNC using that same ctx). Hooked at
# func_8009D3A4's own loop-back label (L_8009D3B8, confirmed reached
# exactly once per iteration of the game's other, still-healthy main
# per-frame loop -- func_8009EEA0 -> func_8009D3A4 -> func_8007A0A0 ->
# func_8007A818, the thread this whole session keeps finding varying
# lines in, never stuck).
[[patches.hook]]
func = "func_8009D3A4"
before_vram = 0x8009D3B8
text = """
    { extern void btga_yield_via_priority_drop(uint8_t *rdram); btga_yield_via_priority_drop(rdram); }
"""

