# mfc0 (cop0 reads) -- N64Recomp only handles mfc0 for cop0 register 12
# (Status); any other register hits "Unhandled cop0 register in mfc0: N".
# All of these are in the dead exception-vector/context-save code path
# (func_8007919C's EPC-skip logic, func_80079260's full-register exception
# context dump reading every cop0 register in sequence, __osException_
# 80104FB0's own exception handler, and one isolated read in func_8011A5F0)
# -- real MIPS hardware exceptions never fire under the recompiled runtime,
# so nothing here needs the real register value. Nopping leaves the
# destination GPR with its prior value, same treatment as the mtc0/eret
