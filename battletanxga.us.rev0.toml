# Config file for BattleTanx: Global Assault (USA) Recompilation.
# Assembled 2026-09-27 (round 20) from the pieces generated in rounds 13-19 --
# see STATUS.md for how each part was derived and PROGRESS.md for what's still
# missing (this covers only the first automatically-loaded MB of code; see
# round 17 for why the remaining ~7MB is believed to be assets, not more code).

[input]
entrypoint = 0x80071000
output_func_path = "RecompiledFuncs"
rom_file_path = "BattleTanx Global Assault (USA).z64"
symbols_file_path = "BattleTanxGASyms/battletanxga.us.rev0.syms.toml"

# Round 54 (STATUS.md): func_8009F02C is reached by a genuinely indirect
# call at runtime ("Failed to find function at 0x8009F02C",
# librecomp/src/overlays.cpp:368's get_function()), but it is NOT a clean
# second-function boundary the way every earlier merged-function fix was --
# it sits mid-instruction-stream inside func_8009EFD4 (the delay slot right
# after `j 0x8009F048` at 0x8009F028), and func_8009EFD4's own internal
# control flow branches to 0x8009F030 and jumps to 0x8009F048, two
# DIFFERENT interior offsets of what a syms.toml split would have carved
# out. N64Recomp refused that split outright ("branching outside of the
# function"/"Unhandled branch"), confirming this is real shared/reused
# tail code (both a fallthrough continuation of func_8009EFD4 AND a
# separate external entry point), not decompiler mis-boundary-detection.
# `manual_funcs` (N64Recomp's mechanism for registering an *additional*,
# independent compiled unit at a given vram+size, coexisting with an
# already-declared overlapping function rather than replacing it -- see
# N64Recomp/src/main.cpp add_manual_functions) is exactly the right tool:
# func_8009EFD4 stays fully intact (0xbc bytes, unsplit) for its own
# direct callers, and this registers the self-contained tail
# (0x8009F02C-0x8009F064, ends in a plain `jr $ra` with no branches
# leaving that range) as its own separately-addressable function for the
# indirect caller that reaches it independently.
manual_funcs = [
    { name = "func_8009F02C", section = ".resident_first_mb", vram = 0x8009f02c, size = 0x38 },
]

# NOTE (round 21): this used to list all 71 libultra/audio names we'd
# cross-referenced against librecomp as [patches] ignored/renamed. Every one
# of them turned out to already be in N64Recomp's own built-in
# reimplemented_funcs/ignored_funcs/renamed_funcs lists (src/symbol_lists.cpp)
# -- N64Recomp applies those automatically before it even looks at this
# config, renaming the matching functions to `name_recomp`. Listing a name
# here too made N64Recomp fail with "Function X is set as ignored in the
# config file but does not exist!", since it had already been renamed by the
# time this list was checked. Confirmed by diffing our 71 names against
# N64Recomp's built-in list: all 71 overlap, 0 remaining that would need to
# be declared here. See STATUS.md round 21.

[patches]
# Stubbed out entirely rather than instruction-patched (round 21): these are
# custom-named fragments of the same exception-vector/dispatch cluster as
# __osException and __osExceptionPreamble (which N64Recomp already skips via
# its own built-in ignored_funcs), but under names N64Recomp doesn't
# recognize, so it tried to actually recompile them and hit branches it
# can't handle statically:
#  - func_8007919C: raw `j 0x80078edc` into the *middle* of __osException's
#    own body (0x80078e4c-0x8007919c) -- "Unhandled branch in func_8007919C
#    at 0x80079228 to 0x80078EDC". This is exception-vector-to-exception-
#    vector control flow, not a normal call; there's nothing a static
#    per-function recompiler can generate for a jump into another function's
#    interior, and it can never run anyway (no real MIPS hardware exception
#    ever fires under the recompiled runtime).
#  - func_80079260: the exception preamble's full-register context-save
#    (every GPR plus every cop0 register in sequence) -- same dead code
#    path, reached only from exception vectors like func_8007919C above.
#  - __osException_80104FB0: a second, differently-based copy of the same
#    exception dispatcher (this ROM apparently has two -- see its own mtc0/
#    mfc0 patches above), same reasoning.
# Their existing cop0/mfc0 instruction patches above are left in place
# (harmless once stubbed) rather than removed, to keep the derivation
# history intact.
#  - func_801000B0: round 22's automated cross-function-branch split (see
#    STATUS.md) split this out of n_alEnvmixerPull's own byte range, since
#    something else branches directly into it. It still contains the same
#    jump table at 0x80100120 that made n_alEnvmixerPull itself
#    unanalyzable (N64Recomp couldn't determine the jump table's size --
#    "Failed to determine size of jump table at 0x80077720 for instruction
#    at 0x80100120", the table it reads isn't in this function's own byte
#    range at all), so it needs the same treatment for the same reason.
# Round 90: func_801000B0 removed -- it was a fragment of n_alEnvmixerPull,
# now merged back into it (STATUS.md).
stubs = ["func_8007919C", "func_80079260", "__osException_80104FB0"]

# n_alEnvmixerPull (round 57, STATUS.md): moved out of stubs and into
# ignored -- a plain empty stub left its return value ($v0/ctx->r2) holding
# a stale, garbage value (since the stub touches nothing), which its own
# caller (func_800FFA90) uses directly as an advanced output-buffer
# pointer, propagating into a write address two calls further up
# (func_80101320) and crashing with an access violation once real audio
# processing code actually got reached. "ignored" (unlike "stubbed") skips
# N64Recomp's decompilation of this function entirely, so the same
# unanalyzable jump table that originally forced stubbing it isn't a
# problem here -- the project supplies its own hand-written C
# implementation instead (src/game/n_alEnvmixerPull_stub.cpp), which at
# least keeps the pointer chain valid (passes the output pointer through
# unchanged -- no real mixing yet, a real gap to revisit along with real
# audio, but no longer a crash).

# func_801025C0 (round 58, STATUS.md): round 57's n_alEnvmixerPull fix
# wasn't enough on its own -- the very next crash was another access
# violation one call deeper, inside _n_saveBuffer, a *real* (not stubbed)
# function that's part of the same "build an RSP audio command list,
# each step advancing a running buffer pointer and returning it" chain
# (func_801025C0 -> func_801028B0 -> func_80102900 -> [polymorphic
# per-voice-type dispatch] -> func_80101320 -> n_alEnvmixerPull/
# _n_saveBuffer). Patching each internal step one at a time risks an
# unbounded number of further crashes in genuinely undocumented DSP
# internals (bit-packed command headers, buffer stride math) this project
# has no real implementation of yet.
#
# func_801025C0 itself already has a legitimate "nothing to process" fast
# path in the real ROM code (checked via disassembly and confirmed by its
# caller's own behavior, funcs_18.c:7123-7136): it takes an output pointer
# (a1) to a caller-local "command count" variable, and when there's
# nothing to do, just writes 0 there and returns -- the caller then reads
# that count back and skips submitting anything further when it's 0. This
# is real, already-correct game logic, not a guess: forcing that same
# path unconditionally (rather than only when the original condition
# happens to be false) is safe and gives "no audio processed this frame"
# instead of a crash, using the game's own no-op contract.
# Round 90: n_alEnvmixerPull and func_801025C0 are no longer replaced by native
# stubs -- their crashes came from the fragmented audio-library symbols
# (STATUS.md round 90), now merged into whole functions.
ignored = []

