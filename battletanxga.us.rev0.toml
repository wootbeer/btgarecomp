# Config file for BattleTanx: Global Assault (USA) Recompilation.
# Assembled 2026-09-27 (round 20) from the pieces generated in rounds 13-19 --
# see STATUS.md for how each part was derived and PROGRESS.md for what's still
# missing (this covers only the first automatically-loaded MB of code; see
# round 17 for why the remaining ~7MB is believed to be assets, not more code).

[input]
entrypoint = 0x80071000
output_func_path = "RecompiledFuncs"
rom_file_path = "BattleTanx Global Assault (USA).z64"
symbols_file_path = "BattleTanxGASyms/battletanxga.us.rev0.syms.toml"

# NOTE (round 21): this used to list all 71 libultra/audio names we'd
# cross-referenced against librecomp as [patches] ignored/renamed. Every one
# of them turned out to already be in N64Recomp's own built-in
# reimplemented_funcs/ignored_funcs/renamed_funcs lists (src/symbol_lists.cpp)
# -- N64Recomp applies those automatically before it even looks at this
# config, renaming the matching functions to `name_recomp`. Listing a name
# here too made N64Recomp fail with "Function X is set as ignored in the
# config file but does not exist!", since it had already been renamed by the
# time this list was checked. Confirmed by diffing our 71 names against
# N64Recomp's built-in list: all 71 overlap, 0 remaining that would need to
# be declared here. See STATUS.md round 21.

[patches]
# Stubbed out entirely rather than instruction-patched (round 21): these are
# custom-named fragments of the same exception-vector/dispatch cluster as
# __osException and __osExceptionPreamble (which N64Recomp already skips via
# its own built-in ignored_funcs), but under names N64Recomp doesn't
# recognize, so it tried to actually recompile them and hit branches it
# can't handle statically:
#  - func_8007919C: raw `j 0x80078edc` into the *middle* of __osException's
#    own body (0x80078e4c-0x8007919c) -- "Unhandled branch in func_8007919C
#    at 0x80079228 to 0x80078EDC". This is exception-vector-to-exception-
#    vector control flow, not a normal call; there's nothing a static
#    per-function recompiler can generate for a jump into another function's
#    interior, and it can never run anyway (no real MIPS hardware exception
#    ever fires under the recompiled runtime).
#  - func_80079260: the exception preamble's full-register context-save
#    (every GPR plus every cop0 register in sequence) -- same dead code
#    path, reached only from exception vectors like func_8007919C above.
#  - __osException_80104FB0: a second, differently-based copy of the same
#    exception dispatcher (this ROM apparently has two -- see its own mtc0/
#    mfc0 patches above), same reasoning.
# Their existing cop0/mfc0 instruction patches above are left in place
# (harmless once stubbed) rather than removed, to keep the derivation
# history intact.
#  - n_alEnvmixerPull: N64Recomp's static analysis couldn't determine the
#    size of a computed jump table this function uses ("Failed to determine
#    size of jump table at 0x80077720 for instruction at 0x80100120") -- the
#    table it's reading isn't in this function's own byte range at all,
#    which the analysis pass requires. This is CPU-side audio envelope-
#    mixing code (the software counterpart to what the RSP audio microcode
#    normally does); stubbed for now to get a build, but this one is a
#    real gap to revisit once real audio is being worked on, not dead code
#    like the others in this list.
#  - func_801000B0: round 22's automated cross-function-branch split (see
#    STATUS.md) split this out of n_alEnvmixerPull's own byte range, since
#    something else branches directly into it. It still contains the same
#    jump table at 0x80100120 that made n_alEnvmixerPull itself
#    unanalyzable, so it needs the same treatment for the same reason.
stubs = ["func_8007919C", "func_80079260", "__osException_80104FB0", "n_alEnvmixerPull", "func_801000B0"]

