# cache -- also unhandled by N64Recomp's recompiler ("Unhandled instruction:
# cache"). Most of this ROM's `cache` users (osInvalDCache/osInvalICache/
# osWritebackDCache/osWritebackDCacheAll) are in N64Recomp's own built-in
# reimplemented_funcs list, so N64Recomp skips recompiling their bodies
# entirely and never touches those cache instructions -- only these two
# small, unnamed icache/dcache-init loops actually need a real nop patch.

[[patches.instruction]]
func = "func_80078DFC"
vram = 0x80078e04
value = 0x00000000

[[patches.instruction]]
func = "func_80078E18"
vram = 0x80078e20
value = 0x00000000

# tltu/tgeu (was here for func_800D8C60 and func_800E7EE0) -- round 21
# mistook both for real compiler-inserted trap checks and nopped them;
# round 22 found both were actually trailing-garbage words past those
# functions' real jr $ra returns, not real instructions at all, and
# removed the patches along with the syms.toml split/truncation that
# excludes them from any function's declared range. See STATUS.md round 22.

[[patches.instruction]]
func = "func_800E7EE0"
vram = 0x800e7f5c
value = 0x00000000

# sync -- N64Recomp's recompiler doesn't handle this instruction at all
# ("Unhandled instruction: sync", found round 21 trying an actual build).
# Nothing in the recompiled-C host needs real memory-ordering barriers here,
# so nop it out same as the cop0 writes. Found by scanning every trusted
# function for opcode==SPECIAL(0)/funct==0x0F (sync's real encoding allows
# the rt/rd/sa fields to hold a nonzero "stype" hint, confirmed against
# capstone's decode of the real bytes -- a naive all-zero-word scan misses
# these).

[[patches.instruction]]
func = "func_800788E8"
vram = 0x80078cdc
value = 0x00000000

[[patches.instruction]]
func = "func_800A60E0"
vram = 0x800a619c
value = 0x00000000

[[patches.instruction]]
func = "func_800D6B80"
vram = 0x800d6e38
value = 0x00000000

[[patches.instruction]]
func = "func_80147864"
vram = 0x80148114
value = 0x00000000

# mfc0 (cop0 reads) -- N64Recomp only handles mfc0 for cop0 register 12
# (Status); any other register hits "Unhandled cop0 register in mfc0: N".
# All of these are in the dead exception-vector/context-save code path
# (func_8007919C's EPC-skip logic, func_80079260's full-register exception
# context dump reading every cop0 register in sequence, __osException_
# 80104FB0's own exception handler, and one isolated read in func_8011A5F0)
# -- real MIPS hardware exceptions never fire under the recompiled runtime,
# so nothing here needs the real register value. Nopping leaves the
# destination GPR with its prior value, same treatment as the mtc0/eret
# patches above. __osException itself and __osProbeTLB/osMapTLBRdb/
# osGetCount's own similar reads didn't need patches here: they're in
# N64Recomp's own built-in reimplemented_funcs/ignored_funcs lists, so
# their bodies are never recompiled at all (round 21).

[[patches.instruction]]
func = "func_8007919C"
vram = 0x80079214
value = 0x00000000

