# Guarded div/divu/ddiv/ddivu hooks for BattleTanx: Global Assault (USA),
# first-MB code only. Generated 2026-09-27 (round 18) by decoding rs/rt operands
# directly from each division instruction's raw encoding, following the exact
# div/divu pattern in bdragoncore/battle-tanx-recomp's battletanx.us.rev0.toml.
#
# CAVEAT: the div (62) and divu (30) hooks below mirror a real, confirmed pattern
# from that reference project. The ddiv (3) and ddivu (6) hooks are this
# project's own extrapolation to 64-bit -- no ddiv/ddivu example existed in the
# reference to confirm the exact syntax against. Verify these before trusting
# them, e.g. against N64Recomp's own documentation/source for the hook context's
# available macros (marked inline below too).

